name: Deploy to GitHub Pages

# Site is published by deploying the main branch directly in repo Pages
# settings (Source = Deploy from a branch). That path is more reliable
# for this static HTML site than the Actions deploy-pages queue, which
# was getting stuck in deployment_queued and timing out.
#
# Kept for optional manual re-enable if you switch Pages back to
# "GitHub Actions" as the source.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
